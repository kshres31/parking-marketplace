name: API and PostGIS tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: parking_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: parking_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking_test -d parking_admin_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://parking_test:test_only_password@localhost:5432/parking_admin_test
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: pytest -v --junitxml=test-results.xml
      - run: python -m scripts.benchmark_search
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parking-verification
          path: |
            test-results.xml
            evidence/search.json
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 30
