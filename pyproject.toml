[project]
name = "parking-marketplace"
version = "0.1.0"
description = "PostGIS parking search and transaction-safe reservations"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.34,<1", "psycopg[binary,pool]>=3.2,<4", "pwdlib[argon2]>=0.2,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a disposable PostgreSQL/PostGIS database"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
