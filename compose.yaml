services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_parking_only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - parking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://parking:${POSTGRES_PASSWORD:-local_parking_only}@db:5432/parking
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m parking.migrate && uvicorn parking.app:app --host 0.0.0.0 --port 8000"]
volumes:
  parking_data:
